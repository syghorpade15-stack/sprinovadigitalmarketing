<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FAQ Manager — SPrinova Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Bricolage+Grotesque:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050b14;--bg2:#080f1c;--bg3:#0c1526;
  --surface:rgba(255,255,255,0.04);--surface2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08);--border2:rgba(0,224,255,0.2);
  --cyan:#00e0ff;--cyan-d:#00b8d4;
  --amber:#f5a623;--amber-l:#ffc754;
  --red:#ff4d4f;
  --white:#f0f8ff;--muted:rgba(200,220,255,0.5);--muted2:rgba(200,220,255,0.3);
  --fd:'Bricolage Grotesque',sans-serif;--fb:'Nunito',sans-serif;
  --glow-cyan:0 0 20px rgba(0,224,255,0.4);
  --glow-amber:0 0 20px rgba(245,166,35,0.4);
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--white);font-family:var(--fb);min-height:100vh;
  background-image:
    linear-gradient(rgba(0,224,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,224,255,0.03) 1px,transparent 1px);
  background-size:60px 60px;
}

/* NAV */
nav{
  display:flex;align-items:center;justify-content:space-between;
  padding:1rem 2rem;border-bottom:1px solid var(--border);
  background:rgba(5,11,20,0.9);backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:100;
}
.nav-logo{font-family:var(--fd);font-weight:800;font-size:1.2rem;color:var(--cyan);text-decoration:none}
.nav-logo span{color:var(--white)}
.nav-links{display:flex;gap:1rem;align-items:center}
.nav-link{
  padding:0.45rem 0.9rem;border-radius:8px;font-size:0.85rem;font-weight:600;
  color:var(--muted);text-decoration:none;transition:all .2s;
}
.nav-link:hover,.nav-link.active{background:var(--surface2);color:var(--cyan)}
.nav-link.active{border:1px solid var(--border2)}
.logout-btn{
  padding:0.45rem 0.9rem;border-radius:8px;font-size:0.85rem;font-weight:600;
  background:transparent;border:1px solid var(--border);color:var(--muted);cursor:pointer;
  transition:all .2s;font-family:var(--fb);
}
.logout-btn:hover{border-color:var(--red);color:var(--red)}
.user-badge{font-size:0.78rem;color:var(--muted2);margin-right:0.5rem}

/* MAIN LAYOUT */
main{max-width:900px;margin:0 auto;padding:2rem 1.5rem}
.page-header{margin-bottom:2rem}
h1{font-family:var(--fd);font-size:2rem;font-weight:800;margin-bottom:0.4rem}
.page-subtitle{color:var(--muted);font-size:0.875rem}

/* FORM CARD */
.card{
  background:var(--bg2);border:1px solid var(--border);border-radius:16px;
  padding:1.8rem;margin-bottom:2rem;
}
.card-title{font-family:var(--fd);font-weight:700;font-size:1.1rem;margin-bottom:1.3rem;color:var(--cyan)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.form-row.single{grid-template-columns:1fr}
.field{margin-bottom:1rem}
label{display:block;font-size:0.78rem;color:var(--muted);margin-bottom:0.4rem;letter-spacing:.04em;text-transform:uppercase}
input[type=text],textarea,select{
  width:100%;padding:0.7rem 0.9rem;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;color:var(--white);
  font-family:var(--fb);font-size:0.9rem;outline:none;transition:border-color .2s;
}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,224,255,0.08)}
textarea{min-height:100px;resize:vertical}
select option{background:var(--bg2)}
.toggle-row{display:flex;align-items:center;gap:0.7rem}
.toggle{width:40px;height:22px;appearance:none;background:var(--border);border-radius:50px;position:relative;cursor:pointer;transition:background .2s}
.toggle:checked{background:var(--cyan)}
.toggle::before{content:'';position:absolute;width:16px;height:16px;background:white;border-radius:50%;top:3px;left:3px;transition:transform .2s}
.toggle:checked::before{transform:translateX(18px)}
.form-actions{display:flex;gap:0.8rem;align-items:center;margin-top:0.5rem}
.btn{
  padding:0.7rem 1.4rem;border-radius:10px;font-family:var(--fd);font-size:0.9rem;
  font-weight:700;cursor:pointer;transition:all .25s;border:1px solid;
}
.btn-primary{background:transparent;border-color:var(--cyan);color:var(--cyan);position:relative;overflow:hidden}
.btn-primary::before{content:'';position:absolute;inset:0;background:var(--cyan);transform:translateX(-100%);transition:transform .25s;z-index:-1}
.btn-primary:hover{color:var(--bg);box-shadow:var(--glow-cyan)}
.btn-primary:hover::before{transform:translateX(0)}
.btn-primary:disabled{opacity:0.4;cursor:not-allowed}
.btn-ghost{background:transparent;border-color:var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--border2);color:var(--white)}
.status-msg{font-size:0.82rem;padding:0.5rem 0.8rem;border-radius:8px;display:none}
.status-success{background:rgba(0,224,255,0.08);border:1px solid rgba(0,224,255,0.2);color:var(--cyan)}
.status-error{background:rgba(255,77,79,0.08);border:1px solid rgba(255,77,79,0.2);color:#ff4d4f}

/* FAQ LIST */
.faq-list{display:flex;flex-direction:column;gap:0.8rem}
.faq-item{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  padding:1.2rem;display:flex;align-items:flex-start;gap:1rem;transition:border-color .2s;
}
.faq-item:hover{border-color:var(--border2)}
.faq-body{flex:1;min-width:0}
.faq-q{font-family:var(--fd);font-weight:700;font-size:0.95rem;margin-bottom:0.4rem;color:var(--white)}
.faq-a{font-size:0.83rem;color:var(--muted);line-height:1.65;white-space:pre-wrap}
.faq-meta{display:flex;gap:0.6rem;margin-top:0.6rem;align-items:center;flex-wrap:wrap}
.badge{
  font-size:0.7rem;padding:0.2rem 0.6rem;border-radius:50px;font-weight:700;letter-spacing:.04em;
}
.badge-cat{background:rgba(0,224,255,0.12);color:var(--cyan);border:1px solid rgba(0,224,255,0.2)}
.badge-pub{background:rgba(0,200,100,0.12);color:#4ade80;border:1px solid rgba(0,200,100,0.2)}
.badge-draft{background:rgba(245,166,35,0.12);color:var(--amber-l);border:1px solid rgba(245,166,35,0.2)}
.faq-actions{display:flex;flex-direction:column;gap:0.4rem}
.action-btn{
  padding:0.35rem 0.7rem;border-radius:8px;font-size:0.75rem;font-weight:600;cursor:pointer;
  border:1px solid;font-family:var(--fd);transition:all .2s;
}
.action-edit{background:transparent;border-color:var(--border2);color:var(--cyan)}
.action-edit:hover{background:rgba(0,224,255,0.08)}
.action-delete{background:transparent;border-color:rgba(255,77,79,0.3);color:var(--red)}
.action-delete:hover{background:rgba(255,77,79,0.08)}
.empty-state{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty-icon{font-size:3rem;margin-bottom:0.8rem}

/* Loading */
.loading{text-align:center;padding:2rem;color:var(--muted);font-size:0.9rem}
.spinner{
  display:inline-block;width:24px;height:24px;border:2px solid var(--border2);
  border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:0.5rem;
}
@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  .form-row{grid-template-columns:1fr}
  nav{padding:0.8rem 1rem}
  .nav-links{gap:0.4rem}
}
</style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">SP<span>rinova</span></a>
  <div class="nav-links">
    <span class="user-badge" id="user-email"></span>
    <a href="/admin/faq.html" class="nav-link active">FAQ</a>
    <a href="/admin/blog.html" class="nav-link">Blog Posts</a>
    <button class="logout-btn" id="logout-btn">Sign Out</button>
  </div>
</nav>

<main>
  <div id="auth-loading" class="loading"><div class="spinner"></div><div>Verifying access…</div></div>

  <div id="admin-content" style="display:none">
    <div class="page-header">
      <h1>FAQ Manager</h1>
      <p class="page-subtitle">Create and manage frequently asked questions shown on the website</p>
    </div>

    <!-- Add / Edit Form -->
    <div class="card">
      <div class="card-title" id="form-title">Add New FAQ</div>
      <input type="hidden" id="edit-id"/>
      <div class="form-row">
        <div class="field">
          <label for="faq-question">Question</label>
          <input type="text" id="faq-question" placeholder="What is SPrinova?"/>
        </div>
        <div class="field">
          <label for="faq-category">Category</label>
          <select id="faq-category">
            <option value="General">General</option>
            <option value="Services">Services</option>
            <option value="Pricing">Pricing</option>
            <option value="Technical">Technical</option>
            <option value="Support">Support</option>
          </select>
        </div>
      </div>
      <div class="form-row single">
        <div class="field">
          <label for="faq-answer">Answer</label>
          <textarea id="faq-answer" placeholder="Provide a clear, helpful answer…"></textarea>
        </div>
      </div>
      <div class="toggle-row" style="margin-bottom:1.2rem">
        <input type="checkbox" class="toggle" id="faq-published" checked/>
        <label for="faq-published" style="text-transform:none;font-size:0.875rem;color:var(--muted)">Published (visible to visitors)</label>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="save-btn">Save FAQ</button>
        <button class="btn btn-ghost" id="cancel-btn" style="display:none">Cancel Edit</button>
        <span class="status-msg" id="form-status"></span>
      </div>
    </div>

    <!-- FAQ List -->
    <div class="card">
      <div class="card-title">All FAQs</div>
      <div id="faq-list">
        <div class="loading"><div class="spinner"></div><div>Loading…</div></div>
      </div>
    </div>
  </div>
</main>

<script type="module">
import { getUser, logout, handleAuthCallback, AuthError } from 'https://esm.sh/@netlify/identity@1';

let token = null;

async function init() {
  try { await handleAuthCallback(); } catch {}

  const user = await getUser();
  if (!user) { window.location.href = '/admin/login.html'; return; }
  const roles = user.app_metadata?.roles ?? [];
  if (!roles.includes('admin')) { window.location.href = '/admin/login.html'; return; }

  token = user.token?.access_token;
  document.getElementById('user-email').textContent = user.email;
  document.getElementById('auth-loading').style.display = 'none';
  document.getElementById('admin-content').style.display = 'block';

  loadFAQs();
}

async function authHeaders() {
  const user = await getUser();
  token = user?.token?.access_token;
  return token ? { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
}

async function loadFAQs() {
  const listEl = document.getElementById('faq-list');
  try {
    const res = await fetch('/api/faqs', { headers: await authHeaders() });
    const faqs = await res.json();
    renderFAQs(faqs);
  } catch {
    listEl.innerHTML = '<div class="loading" style="color:#ff4d4f">Failed to load FAQs.</div>';
  }
}

function renderFAQs(faqs) {
  const listEl = document.getElementById('faq-list');
  if (!faqs.length) {
    listEl.innerHTML = `<div class="empty-state"><div class="empty-icon">❓</div><p>No FAQs yet. Create your first one above!</p></div>`;
    return;
  }
  listEl.innerHTML = `<div class="faq-list">${faqs.map(f => `
    <div class="faq-item" data-id="${f.id}">
      <div class="faq-body">
        <div class="faq-q">${esc(f.question)}</div>
        <div class="faq-a">${esc(f.answer)}</div>
        <div class="faq-meta">
          <span class="badge badge-cat">${esc(f.category || 'General')}</span>
          <span class="badge ${f.published ? 'badge-pub' : 'badge-draft'}">${f.published ? 'Published' : 'Draft'}</span>
        </div>
      </div>
      <div class="faq-actions">
        <button class="action-btn action-edit" onclick="editFAQ(${f.id})">Edit</button>
        <button class="action-btn action-delete" onclick="deleteFAQ(${f.id})">Delete</button>
      </div>
    </div>`).join('')}</div>`;
}

let faqsCache = [];

async function loadAndCache() {
  const res = await fetch('/api/faqs', { headers: await authHeaders() });
  faqsCache = await res.json();
  renderFAQs(faqsCache);
}

window.editFAQ = function(id) {
  const f = faqsCache.find(x => x.id === id);
  if (!f) return;
  document.getElementById('edit-id').value = id;
  document.getElementById('faq-question').value = f.question;
  document.getElementById('faq-answer').value = f.answer;
  document.getElementById('faq-category').value = f.category || 'General';
  document.getElementById('faq-published').checked = !!f.published;
  document.getElementById('form-title').textContent = 'Edit FAQ';
  document.getElementById('save-btn').textContent = 'Update FAQ';
  document.getElementById('cancel-btn').style.display = '';
  document.getElementById('faq-question').scrollIntoView({ behavior: 'smooth', block: 'center' });
};

window.deleteFAQ = async function(id) {
  if (!confirm('Delete this FAQ? This cannot be undone.')) return;
  try {
    await fetch(`/api/faqs?id=${id}`, { method: 'DELETE', headers: await authHeaders() });
    faqsCache = faqsCache.filter(f => f.id !== id);
    renderFAQs(faqsCache);
  } catch { alert('Failed to delete FAQ.'); }
};

document.getElementById('cancel-btn').addEventListener('click', resetForm);

document.getElementById('save-btn').addEventListener('click', async () => {
  const btn = document.getElementById('save-btn');
  const statusEl = document.getElementById('form-status');
  const question = document.getElementById('faq-question').value.trim();
  const answer = document.getElementById('faq-answer').value.trim();
  const category = document.getElementById('faq-category').value;
  const published = document.getElementById('faq-published').checked;
  const editId = document.getElementById('edit-id').value;

  if (!question || !answer) { showStatus(statusEl, 'Question and answer are required.', false); return; }

  btn.disabled = true;
  hideStatus(statusEl);

  try {
    if (editId) {
      const res = await fetch(`/api/faqs?id=${editId}`, {
        method: 'PUT', headers: await authHeaders(),
        body: JSON.stringify({ question, answer, category, published }),
      });
      const updated = await res.json();
      faqsCache = faqsCache.map(f => f.id === updated.id ? updated : f);
    } else {
      const res = await fetch('/api/faqs', {
        method: 'POST', headers: await authHeaders(),
        body: JSON.stringify({ question, answer, category, published }),
      });
      const created = await res.json();
      faqsCache.push(created);
    }
    renderFAQs(faqsCache);
    resetForm();
    showStatus(statusEl, editId ? 'FAQ updated!' : 'FAQ created!', true);
  } catch {
    showStatus(statusEl, 'Failed to save FAQ.', false);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => {
  await logout();
  window.location.href = '/admin/login.html';
});

function resetForm() {
  document.getElementById('edit-id').value = '';
  document.getElementById('faq-question').value = '';
  document.getElementById('faq-answer').value = '';
  document.getElementById('faq-category').value = 'General';
  document.getElementById('faq-published').checked = true;
  document.getElementById('form-title').textContent = 'Add New FAQ';
  document.getElementById('save-btn').textContent = 'Save FAQ';
  document.getElementById('cancel-btn').style.display = 'none';
}

function showStatus(el, msg, ok) {
  el.textContent = msg;
  el.className = 'status-msg ' + (ok ? 'status-success' : 'status-error');
  el.style.display = 'inline-block';
  if (ok) setTimeout(() => { el.style.display = 'none'; }, 3000);
}
function hideStatus(el) { el.style.display = 'none'; }
function esc(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// override load to use cache
async function loadFAQsInit() {
  const listEl = document.getElementById('faq-list');
  try {
    const res = await fetch('/api/faqs', { headers: await authHeaders() });
    faqsCache = await res.json();
    renderFAQs(faqsCache);
  } catch {
    listEl.innerHTML = '<div class="loading" style="color:#ff4d4f">Failed to load FAQs.</div>';
  }
}
// Replace original loadFAQs call after init
async function initPage() {
  try { await handleAuthCallback(); } catch {}
  const user = await getUser();
  if (!user) { window.location.href = '/admin/login.html'; return; }
  const roles = user.app_metadata?.roles ?? [];
  if (!roles.includes('admin')) { window.location.href = '/admin/login.html'; return; }
  token = user.token?.access_token;
  document.getElementById('user-email').textContent = user.email;
  document.getElementById('auth-loading').style.display = 'none';
  document.getElementById('admin-content').style.display = 'block';
  loadFAQsInit();
}
initPage();
</script>
</body>
</html>
