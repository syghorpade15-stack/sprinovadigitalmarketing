<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Login — SPrinova</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Bricolage+Grotesque:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050b14;--bg2:#080f1c;--bg3:#0c1526;
  --surface:rgba(255,255,255,0.04);--surface2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08);--border2:rgba(0,224,255,0.2);
  --cyan:#00e0ff;--cyan-d:#00b8d4;
  --amber:#f5a623;--amber-l:#ffc754;
  --white:#f0f8ff;--muted:rgba(200,220,255,0.5);--muted2:rgba(200,220,255,0.3);
  --fd:'Bricolage Grotesque',sans-serif;--fb:'Nunito',sans-serif;
  --glow-cyan:0 0 20px rgba(0,224,255,0.4);
}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--white);font-family:var(--fb);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background-image:
    linear-gradient(rgba(0,224,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,224,255,0.03) 1px,transparent 1px);
  background-size:60px 60px;
}
.login-card{
  background:var(--bg2);border:1px solid var(--border2);border-radius:20px;
  padding:2.5rem;width:100%;max-width:420px;
  box-shadow:0 0 60px rgba(0,224,255,0.06);
}
.logo{
  display:flex;align-items:center;gap:0.7rem;margin-bottom:2rem;
  font-family:var(--fd);font-weight:800;font-size:1.4rem;color:var(--cyan);
  text-decoration:none;
}
.logo span{color:var(--white)}
h1{font-family:var(--fd);font-size:1.6rem;font-weight:800;margin-bottom:0.4rem}
.subtitle{color:var(--muted);font-size:0.875rem;margin-bottom:2rem}
.field{margin-bottom:1.2rem}
label{display:block;font-size:0.8rem;color:var(--muted);margin-bottom:0.4rem;letter-spacing:.04em;text-transform:uppercase}
input{
  width:100%;padding:0.75rem 1rem;background:var(--surface2);
  border:1px solid var(--border);border-radius:10px;color:var(--white);
  font-family:var(--fb);font-size:0.95rem;outline:none;transition:border-color .2s;
}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,224,255,0.08)}
.btn{
  width:100%;padding:0.85rem;background:transparent;border:1px solid var(--cyan);
  border-radius:10px;color:var(--cyan);font-family:var(--fd);font-size:1rem;
  font-weight:700;cursor:pointer;transition:all .25s;position:relative;overflow:hidden;margin-top:0.5rem;
}
.btn::before{content:'';position:absolute;inset:0;background:var(--cyan);transform:translateX(-100%);transition:transform .25s;z-index:-1}
.btn:hover{color:var(--bg);box-shadow:var(--glow-cyan)}
.btn:hover::before{transform:translateX(0)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.error-msg{color:#ff6b6b;font-size:0.82rem;margin-top:1rem;padding:0.7rem;background:rgba(255,107,107,0.08);border:1px solid rgba(255,107,107,0.2);border-radius:8px;display:none}
.back{display:inline-block;color:var(--muted);font-size:0.82rem;text-decoration:none;margin-top:1.5rem;transition:color .2s}
.back:hover{color:var(--cyan)}
.shield{font-size:2.5rem;margin-bottom:1rem}
</style>
</head>
<body>
<div class="login-card">
  <a href="/" class="logo">SP<span>rinova</span></a>
  <div class="shield">🛡️</div>
  <h1>Admin Login</h1>
  <p class="subtitle">Sign in to access the admin dashboard</p>
  <form id="login-form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="admin@example.com" required autocomplete="email"/>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password"/>
    </div>
    <button type="submit" class="btn" id="login-btn">Sign In</button>
    <div class="error-msg" id="error-msg"></div>
  </form>
  <a href="/" class="back">← Back to website</a>
</div>

<script type="module">
import { login, getUser, handleAuthCallback, AuthError, MissingIdentityError } from 'https://esm.sh/@netlify/identity@1';

async function init() {
  try {
    await handleAuthCallback();
  } catch {}

  const user = await getUser();
  if (user) {
    const roles = user.app_metadata?.roles ?? [];
    if (roles.includes('admin')) {
      window.location.href = '/admin/faq.html';
      return;
    }
    showError('Your account does not have admin privileges.');
    return;
  }
}

init();

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  btn.disabled = true;
  btn.textContent = 'Signing in…';
  hideError();

  try {
    const user = await login(email, password);
    const roles = user.app_metadata?.roles ?? [];
    if (!roles.includes('admin')) {
      showError('Your account does not have admin privileges.');
      btn.disabled = false;
      btn.textContent = 'Sign In';
      return;
    }
    window.location.href = '/admin/faq.html';
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Sign In';
    if (err instanceof MissingIdentityError) {
      showError('Identity service is not configured. Please contact the site owner.');
    } else if (err instanceof AuthError) {
      showError(err.status === 401 ? 'Invalid email or password.' : err.message);
    } else {
      showError('An unexpected error occurred.');
    }
  }
});

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() {
  document.getElementById('error-msg').style.display = 'none';
}
</script>
</body>
</html>
